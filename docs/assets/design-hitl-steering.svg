<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1041" viewBox="0 0 1600 1041" role="img" aria-labelledby="title desc">
<title id="title">User steering: acceptance, invalidation and application</title>
<desc id="desc">Time runs downward. Solid arrows are calls; dashed arrows are returns. Frames identify parallel and alternative branches.</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="1041" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">User steering: acceptance, invalidation and application</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">Time runs downward · solid calls / dashed returns</tspan></text>
<rect x="735" y="438" width="770" height="362" rx="5" fill="#F7FAFD" stroke="#C5D1DE" stroke-width="1.2"/>
<text x="747" y="462" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">alt</tspan></text>
<text x="793" y="462" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">Old work not dispatched</tspan></text>
<path d="M735 608H1505" stroke="#C5D1DE" stroke-width="1" stroke-dasharray="5 4"/>
<text x="747" y="628" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">else</tspan></text>
<text x="793" y="628" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">Action already dispatched</tspan></text>
<path d="M160 130V1013" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="40" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="160" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="160" dy="0">Assistant / caller</tspan></text>
<path d="M480 130V1013" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="360" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="480" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="480" dy="0">API / control inbox</tspan></text>
<path d="M800 130V1013" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="680" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="800" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Harness</tspan></text>
<path d="M1120 130V1013" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1000" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1120" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">Model call</tspan></text>
<path d="M1440 130V1013" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1320" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1440" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1440" dy="0">Driver</tspan></text>
<g data-message="1" data-from="U" data-to="C" data-label="Submit change and request_key">
<text x="320" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">Submit change and request_key</tspan></text>
<path d="M160 186H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="2" data-from="C" data-to="C" data-label="Persist ordered change and revision">
<text x="541" y="228" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="541" dy="0">Persist ordered change and</tspan><tspan x="541" dy="22">revision</tspan></text>
<path d="M480 263h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="3" data-from="C" data-to="U" data-label="Acknowledge accepted, not applied">
<text x="320" y="323" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="320" dy="0">Acknowledge accepted, not</tspan><tspan x="320" dy="22">applied</tspan></text>
<path d="M480 358H160" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="4" data-from="C" data-to="H" data-label="Notify control change">
<text x="640" y="400" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">Notify control change</tspan></text>
<path d="M480 413H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="5" data-from="H" data-to="H" data-label="Revoke old eligibility; replan">
<text x="861" y="492" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">Revoke old eligibility; replan</tspan></text>
<path d="M800 505h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="6" data-from="M" data-to="H" data-label="Late old reply: diagnostics only">
<text x="960" y="565" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="960" dy="0">Late old reply: diagnostics only</tspan></text>
<path d="M1120 578H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="7" data-from="D" data-to="H" data-label="Return actual result; persist first">
<text x="1120" y="658" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="1120" dy="0">Return actual result; persist first</tspan></text>
<path d="M1440 671H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="8" data-from="H" data-to="H" data-label="Close records before applying change">
<text x="861" y="713" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">Close records before</tspan><tspan x="861" dy="22">applying change</tspan></text>
<path d="M800 748h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="9" data-from="H" data-to="M" data-label="Planner reads changes and valid progress">
<text x="960" y="837" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="960" dy="0">Planner reads changes and valid</tspan><tspan x="960" dy="22">progress</tspan></text>
<path d="M800 872H1120" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="10" data-from="M" data-to="H" data-label="Retain stage or revise plan">
<text x="960" y="914" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="960" dy="0">Retain stage or revise plan</tspan></text>
<path d="M1120 927H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="11" data-from="H" data-to="C" data-label="Record applied revision and plan">
<text x="640" y="969" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">Record applied revision and plan</tspan></text>
<path d="M800 982H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
</svg>
