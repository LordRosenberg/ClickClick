<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1287" viewBox="0 0 1600 1287" role="img" aria-labelledby="title desc">
<title id="title">Observation and execution consistency</title>
<desc id="desc">Time runs downward. Solid arrows are calls; dashed arrows are returns. Frames identify parallel and alternative branches.</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="1287" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">Observation and execution consistency</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">Time runs downward · solid calls / dashed returns</tspan></text>
<rect x="735" y="211" width="770" height="326" rx="5" fill="#F7FAFD" stroke="#C5D1DE" stroke-width="1.2"/>
<text x="747" y="235" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">par</tspan></text>
<text x="793" y="235" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">Pixels</tspan></text>
<path d="M735 363H1505" stroke="#C5D1DE" stroke-width="1" stroke-dasharray="5 4"/>
<text x="747" y="383" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">and</tspan></text>
<text x="793" y="383" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">UI structure</tspan></text>
<path d="M160 130V1259" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="40" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="160" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="160" dy="0">Role model</tspan></text>
<path d="M480 130V1259" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="360" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="480" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="480" dy="0">Harness</tspan></text>
<path d="M800 130V1259" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="680" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="800" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Driver / observation</tspan></text>
<path d="M1120 130V1259" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1000" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1120" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">Collector</tspan></text>
<path d="M1440 130V1259" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1320" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1440" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1440" dy="0">Android</tspan></text>
<g data-message="1" data-from="harness" data-to="driver" data-label="Capture current observation O1">
<text x="640" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">Capture current observation O1</tspan></text>
<path d="M480 186H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="2" data-from="driver" data-to="android" data-label="Acquire pixels via scrcpy / ADB">
<text x="1120" y="265" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">Acquire pixels via scrcpy / ADB</tspan></text>
<path d="M800 278H1440" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="3" data-from="android" data-to="driver" data-label="Pixels, frame position and geometry">
<text x="1120" y="320" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="1120" dy="0">Pixels, frame position and geometry</tspan></text>
<path d="M1440 333H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="4" data-from="driver" data-to="collector" data-label="Request tree and window state">
<text x="960" y="413" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="960" dy="0">Request tree and window state</tspan></text>
<path d="M800 426H1120" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="5" data-from="collector" data-to="driver" data-label="Tree, window generation and handles">
<text x="960" y="468" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="960" dy="0">Tree, window generation and</tspan><tspan x="960" dy="22">handles</tspan></text>
<path d="M1120 503H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="6" data-from="driver" data-to="harness" data-label="Deliver checked observation O1">
<text x="640" y="574" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="640" dy="0">Deliver checked observation O1</tspan></text>
<path d="M800 587H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="7" data-from="harness" data-to="model" data-label="Task, context and O1">
<text x="320" y="629" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">Task, context and O1</tspan></text>
<path d="M480 642H160" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="8" data-from="model" data-to="harness" data-label="Action and observation ID of O1">
<text x="320" y="684" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="320" dy="0">Action and observation ID of O1</tspan></text>
<path d="M160 697H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="9" data-from="harness" data-to="driver" data-label="Validate O1 and target, then dispatch">
<text x="640" y="739" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">Validate O1 and target, then</tspan><tspan x="640" dy="22">dispatch</tspan></text>
<path d="M480 774H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="10" data-from="driver" data-to="driver" data-label="Record frame position, no extra capture">
<text x="861" y="816" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">Record frame position, no</tspan><tspan x="861" dy="22">extra capture</tspan></text>
<path d="M800 851h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="11" data-from="driver" data-to="android" data-label="Execute action via the selected path">
<text x="1120" y="911" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">Execute action via the selected path</tspan></text>
<path d="M800 924H1440" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="12" data-from="android" data-to="driver" data-label="Dispatch result">
<text x="1120" y="966" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="1120" dy="0">Dispatch result</tspan></text>
<path d="M1440 979H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="13" data-from="driver" data-to="driver" data-label="Commit boundary on success, capture O2">
<text x="861" y="1021" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">Commit boundary on success,</tspan><tspan x="861" dy="22">capture O2</tspan></text>
<path d="M800 1056h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="14" data-from="driver" data-to="harness" data-label="Receipt and accepted post-observation O2">
<text x="640" y="1116" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="640" dy="0">Receipt and accepted</tspan><tspan x="640" dy="22">post-observation O2</tspan></text>
<path d="M800 1151H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="15" data-from="harness" data-to="model" data-label="Persist and deliver O2 for next decision">
<text x="320" y="1193" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">Persist and deliver O2 for next</tspan><tspan x="320" dy="22">decision</tspan></text>
<path d="M480 1228H160" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
</svg>
