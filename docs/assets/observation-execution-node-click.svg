<text x="1380" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1380" dy="0">Android node</tspan></text>
<g data-message="1" data-from="harness" data-to="collector" data-label="node_click with private handle">
<text x="510" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="510" dy="0">node_click with private handle</tspan></text>
<path d="M220 186H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
