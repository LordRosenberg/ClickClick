<text x="510" y="724" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="510" dy="0">Return reason, no old-coordinate fallback</tspan></text>
<path d="M800 737H220" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
