<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="825" viewBox="0 0 1600 825" role="img" aria-labelledby="title desc">
<title id="title">Native node click: attributes and execution</title>
<desc id="desc">Time runs downward. Solid arrows are calls; dashed arrows are returns. Frames identify parallel and alternative branches.</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="825" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">Native node click: attributes and execution</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">Time runs downward · solid calls / dashed returns</tspan></text>
<rect x="155" y="467" width="1290" height="304" rx="5" fill="#F7FAFD" stroke="#C5D1DE" stroke-width="1.2"/>
<text x="167" y="491" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="167" dy="0">alt</tspan></text>
<text x="213" y="491" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="213" dy="0">Valid node and matching attributes</tspan></text>
<path d="M155 674H1445" stroke="#C5D1DE" stroke-width="1" stroke-dasharray="5 4"/>
<text x="167" y="694" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="167" dy="0">else</tspan></text>
<text x="213" y="694" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="213" dy="0">Obsolete or unavailable target</tspan></text>
<path d="M220 130V797" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
