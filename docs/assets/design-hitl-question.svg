<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="901" viewBox="0 0 1600 901" role="img" aria-labelledby="title desc">
<title id="title">HITL questions: durable wait and original-call resume</title>
<desc id="desc">Time runs downward. Solid arrows are calls; dashed arrows are returns. Frames identify parallel and alternative branches.</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="901" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">HITL questions: durable wait and original-call resume</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">Time runs downward · solid calls / dashed returns</tspan></text>
<path d="M160 130V873" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="40" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="160" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="160" dy="0">Role session / Harness</tspan></text>
<path d="M480 130V873" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="360" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="480" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="480" dy="0">HITL Broker</tspan></text>
<path d="M800 130V873" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="680" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="800" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Session / DB</tspan></text>
<path d="M1120 130V873" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1000" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1120" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">Reply surface</tspan></text>
<path d="M1440 130V873" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1320" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1440" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1440" dy="0">Device</tspan></text>
<g data-message="1" data-from="A" data-to="B" data-label="ask_user with original call identity">
<text x="320" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">ask_user with original call</tspan><tspan x="320" dy="22">identity</tspan></text>
<path d="M160 208H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="2" data-from="B" data-to="S" data-label="Persist question, dialogue, owner version">
<text x="640" y="250" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">Persist question, dialogue, owner</tspan><tspan x="640" dy="22">version</tspan></text>
<path d="M480 285H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="3" data-from="B" data-to="B" data-label="Enter waiting_for_input; yield worker">
<text x="541" y="327" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="541" dy="0">Enter waiting_for_input;</tspan><tspan x="541" dy="22">yield worker</tspan></text>
<path d="M480 362h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="4" data-from="B" data-to="U" data-label="Push question or provide Console entry">
<text x="800" y="422" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Push question or provide Console entry</tspan></text>
<path d="M480 435H1120" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="5" data-from="U" data-to="B" data-label="Acknowledge display, not consent">
<text x="800" y="477" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Acknowledge display, not consent</tspan></text>
<path d="M1120 490H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="6" data-from="U" data-to="B" data-label="Explicit reply with response_id">
<text x="800" y="532" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Explicit reply with response_id</tspan></text>
<path d="M1120 545H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="7" data-from="B" data-to="S" data-label="Check question, version and idempotency">
<text x="640" y="587" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">Check question, version and</tspan><tspan x="640" dy="22">idempotency</tspan></text>
<path d="M480 622H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="8" data-from="S" data-to="B" data-label="Unique accepted answer">
<text x="640" y="664" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="640" dy="0">Unique accepted answer</tspan></text>
<path d="M800 677H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="9" data-from="B" data-to="A" data-label="Continue the original tool call">
<text x="320" y="719" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="320" dy="0">Continue the original tool call</tspan></text>
<path d="M480 732H160" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="10" data-from="A" data-to="D" data-label="Refresh before further GUI actions">
<text x="800" y="774" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Refresh before further GUI actions</tspan></text>
<path d="M160 787H1440" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="11" data-from="D" data-to="A" data-label="Fresh observation; same budget/deadline">
<text x="800" y="829" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="800" dy="0">Fresh observation; same budget/deadline</tspan></text>
<path d="M1440 842H160" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
</svg>
