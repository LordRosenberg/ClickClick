<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="835" viewBox="0 0 1600 835" role="img" aria-labelledby="title desc">
<title id="title">HITL 提问：持久等待与原调用续接</title>
<desc id="desc">时间从上到下，实线为调用，虚线为返回；并行与条件分支标注在框内。</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="835" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">HITL 提问：持久等待与原调用续接</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">时间从上到下 · 实线调用 / 虚线返回</tspan></text>
<path d="M160 130V807" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="40" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="160" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="160" dy="0">角色会话 / Harness</tspan></text>
<path d="M480 130V807" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="360" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="480" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="480" dy="0">HITL Broker</tspan></text>
<path d="M800 130V807" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="680" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="800" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Session / DB</tspan></text>
<path d="M1120 130V807" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1000" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1120" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">回答入口</tspan></text>
<path d="M1440 130V807" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1320" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1440" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1440" dy="0">设备</tspan></text>
<g data-message="1" data-from="A" data-to="B" data-label="ask_user，保留原调用身份">
<text x="320" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">ask_user，保留原调用身份</tspan></text>
<path d="M160 186H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="2" data-from="B" data-to="S" data-label="保存问题、对话与入口版本">
<text x="640" y="228" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">保存问题、对话与入口版本</tspan></text>
<path d="M480 241H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="3" data-from="B" data-to="B" data-label="进入 waiting_for_input，释放 worker">
<text x="541" y="283" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="541" dy="0">进入 waiting_for_input，释放</tspan><tspan x="541" dy="22">worker</tspan></text>
<path d="M480 318h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="4" data-from="B" data-to="U" data-label="推送问题或提供 Console 入口">
<text x="800" y="378" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">推送问题或提供 Console 入口</tspan></text>
<path d="M480 391H1120" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="5" data-from="U" data-to="B" data-label="确认已呈现，不自动提交选项">
<text x="800" y="433" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">确认已呈现，不自动提交选项</tspan></text>
<path d="M1120 446H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="6" data-from="U" data-to="B" data-label="用户明确回复与 response_id">
<text x="800" y="488" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">用户明确回复与 response_id</tspan></text>
<path d="M1120 501H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="7" data-from="B" data-to="S" data-label="核对问题、版本与幂等身份">
<text x="640" y="543" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">核对问题、版本与幂等身份</tspan></text>
<path d="M480 556H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="8" data-from="S" data-to="B" data-label="唯一接受结果">
<text x="640" y="598" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="640" dy="0">唯一接受结果</tspan></text>
<path d="M800 611H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="9" data-from="B" data-to="A" data-label="作为原 tool call 的结果续接">
<text x="320" y="653" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="320" dy="0">作为原 tool call 的结果续接</tspan></text>
<path d="M480 666H160" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="10" data-from="A" data-to="D" data-label="后续 GUI 动作前刷新观测">
<text x="800" y="708" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">后续 GUI 动作前刷新观测</tspan></text>
<path d="M160 721H1440" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="11" data-from="D" data-to="A" data-label="最新观测，沿用原预算与期限">
<text x="800" y="763" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="800" dy="0">最新观测，沿用原预算与期限</tspan></text>
<path d="M1440 776H160" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
</svg>
