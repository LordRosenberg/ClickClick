<text x="213" y="491" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="213" dy="0">Target focus confirmed</tspan></text>
<path d="M155 747H1445" stroke="#C5D1DE" stroke-width="1" stroke-dasharray="5 4"/>
<text x="167" y="767" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="167" dy="0">else</tspan></text>
<text x="213" y="767" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="213" dy="0">Focus unconfirmed</tspan></text>
