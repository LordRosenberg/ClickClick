<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1155" viewBox="0 0 1600 1155" role="img" aria-labelledby="title desc">
<title id="title">观测与执行一致性：主时序</title>
<desc id="desc">时间从上到下，实线为调用，虚线为返回；并行与条件分支标注在框内。</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="1155" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">观测与执行一致性：主时序</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">时间从上到下 · 实线调用 / 虚线返回</tspan></text>
<rect x="735" y="211" width="770" height="304" rx="5" fill="#F7FAFD" stroke="#C5D1DE" stroke-width="1.2"/>
<text x="747" y="235" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">par</tspan></text>
<text x="793" y="235" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">视频画面</tspan></text>
<path d="M735 363H1505" stroke="#C5D1DE" stroke-width="1" stroke-dasharray="5 4"/>
<text x="747" y="383" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">and</tspan></text>
<text x="793" y="383" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">UI 结构</tspan></text>
<path d="M160 130V1127" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="40" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="160" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="160" dy="0">角色模型</tspan></text>
<path d="M480 130V1127" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="360" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="480" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="480" dy="0">Harness</tspan></text>
<path d="M800 130V1127" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="680" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="800" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Driver / 观测事务</tspan></text>
<path d="M1120 130V1127" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1000" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1120" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">Collector</tspan></text>
<path d="M1440 130V1127" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1320" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1440" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1440" dy="0">Android</tspan></text>
<g data-message="1" data-from="harness" data-to="driver" data-label="采集当前观测 O1">
<text x="640" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">采集当前观测 O1</tspan></text>
<path d="M480 186H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="2" data-from="driver" data-to="android" data-label="获取画面（scrcpy / ADB）">
<text x="1120" y="265" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">获取画面（scrcpy / ADB）</tspan></text>
<path d="M800 278H1440" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="3" data-from="android" data-to="driver" data-label="像素、帧位置与几何">
<text x="1120" y="320" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="1120" dy="0">像素、帧位置与几何</tspan></text>
<path d="M1440 333H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="4" data-from="driver" data-to="collector" data-label="获取树和窗口信息">
<text x="960" y="413" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="960" dy="0">获取树和窗口信息</tspan></text>
<path d="M800 426H1120" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="5" data-from="collector" data-to="driver" data-label="UI 树、窗口代次、节点句柄">
<text x="960" y="468" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="960" dy="0">UI 树、窗口代次、节点句柄</tspan></text>
<path d="M1120 481H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="6" data-from="driver" data-to="harness" data-label="校验后交付 O1">
<text x="640" y="552" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="640" dy="0">校验后交付 O1</tspan></text>
<path d="M800 565H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="7" data-from="harness" data-to="model" data-label="任务、上下文和 O1">
<text x="320" y="607" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">任务、上下文和 O1</tspan></text>
<path d="M480 620H160" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="8" data-from="model" data-to="harness" data-label="动作与 O1 的观测 ID">
<text x="320" y="662" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="320" dy="0">动作与 O1 的观测 ID</tspan></text>
<path d="M160 675H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="9" data-from="harness" data-to="driver" data-label="校验 O1、索引或坐标后派发">
<text x="640" y="717" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">校验 O1、索引或坐标后派发</tspan></text>
<path d="M480 730H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="10" data-from="driver" data-to="driver" data-label="记录帧位置（不额外截图）">
<text x="861" y="772" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">记录帧位置（不额外截图）</tspan></text>
<path d="M800 785h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="11" data-from="driver" data-to="android" data-label="执行动作（具体路径见分图）">
<text x="1120" y="845" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">执行动作（具体路径见分图）</tspan></text>
<path d="M800 858H1440" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="12" data-from="android" data-to="driver" data-label="派发结果">
<text x="1120" y="900" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="1120" dy="0">派发结果</tspan></text>
<path d="M1440 913H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="13" data-from="driver" data-to="driver" data-label="成功时提交边界，再采集 O2">
<text x="861" y="955" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">成功时提交边界，再采集 O2</tspan></text>
<path d="M800 968h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="14" data-from="driver" data-to="harness" data-label="回执与有效后观测 O2">
<text x="640" y="1028" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="640" dy="0">回执与有效后观测 O2</tspan></text>
<path d="M800 1041H480" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="15" data-from="harness" data-to="model" data-label="保存并交付 O2，进入下一轮">
<text x="320" y="1083" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">保存并交付 O2，进入下一轮</tspan></text>
<path d="M480 1096H160" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
</svg>
