<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From task experience to reusable skills</title>
<desc id="desc">Real task records feed continuous Learner analysis, independent Skill Reviewer assessment, pending candidates and the canonical library after human approval. Optional exploration and ordinary task trials return evidence to research and review. Unproductive sources may skip. All phases retain provenance and share a budget.</desc>
