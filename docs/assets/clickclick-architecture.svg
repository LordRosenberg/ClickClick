<text x="247" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#586575" text-anchor="start"><tspan x="247" dy="0">Model, harness and persistent Session</tspan></text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#263449" text-anchor="start"><tspan x="40" dy="0">Context management in the harness  ·  durable records in Session  ·  device tools execute and observe</tspan></text>
