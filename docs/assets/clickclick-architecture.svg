<text x="70" y="813" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#586575" text-anchor="start"><tspan x="70" dy="0">Read Session to build context; record events, evidence and state updates through the store.</tspan></text>
