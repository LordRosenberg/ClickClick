<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270" role="img" aria-labelledby="title description">
<title id="title">ClickClick: revisable planning with grounded device feedback</title>
<desc id="description">Separate model and agent harness. A prominent Session column stands beside the harness and retains history, note versions and observation artifacts. Context management stays in the harness. Device tools and the Android environment execute actions; Console and evaluation consume Session records.</desc>
<defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#263449"/></marker>
<marker id="evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#287568"/></marker>
<marker id="review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#80618E"/></marker>
</defs>
<rect width="1600" height="1270" fill="white"/>
