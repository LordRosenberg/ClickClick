<text x="60" y="166" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#586575" text-anchor="start"><tspan x="60" dy="0">Interpret task and evidence · reason · choose actions · judge outcomes</tspan></text>
