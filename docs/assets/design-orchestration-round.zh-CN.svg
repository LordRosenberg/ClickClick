<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1464" viewBox="0 0 1600 1464" role="img" aria-labelledby="title desc">
<title id="title">滚动细化时序：阶段推进、假设修订与任务判断</title>
<desc id="desc">时间从上到下，实线为调用，虚线为返回；并行与条件分支标注在框内。</desc>
<defs>
