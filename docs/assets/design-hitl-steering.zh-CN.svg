<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="975" viewBox="0 0 1600 975" role="img" aria-labelledby="title desc">
<title id="title">用户介入：接收、失效与生效顺序</title>
<desc id="desc">时间从上到下，实线为调用，虚线为返回；并行与条件分支标注在框内。</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#263449"/></marker>
<marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#287568"/></marker>
</defs>
<rect width="1600" height="975" fill="white"/>
<text x="40" y="39" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#263449" text-anchor="start"><tspan x="40" dy="0">用户介入：接收、失效与生效顺序</tspan></text>
<text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#586575" text-anchor="start"><tspan x="40" dy="0">时间从上到下 · 实线调用 / 虚线返回</tspan></text>
<rect x="735" y="416" width="770" height="340" rx="5" fill="#F7FAFD" stroke="#C5D1DE" stroke-width="1.2"/>
<text x="747" y="440" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">alt</tspan></text>
<text x="793" y="440" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">旧工作尚未派发</tspan></text>
<path d="M735 586H1505" stroke="#C5D1DE" stroke-width="1" stroke-dasharray="5 4"/>
<text x="747" y="606" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" fill="#456B96" text-anchor="start"><tspan x="747" dy="0">else</tspan></text>
<text x="793" y="606" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#586575" text-anchor="start"><tspan x="793" dy="0">动作已派发</tspan></text>
<path d="M160 130V947" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="40" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="160" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="160" dy="0">助手 / API 调用方</tspan></text>
<path d="M480 130V947" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="360" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="480" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="480" dy="0">API / 控制收件箱</tspan></text>
<path d="M800 130V947" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="680" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="800" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="800" dy="0">Harness</tspan></text>
<path d="M1120 130V947" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1000" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1120" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1120" dy="0">模型调用</tspan></text>
<path d="M1440 130V947" stroke="#B3BFCC" stroke-width="1.1" stroke-dasharray="5 5"/>
<rect x="1320" y="86" width="240" height="45" rx="5" fill="#EDF3FA" stroke="#456B96" stroke-width="1.3"/>
<text x="1440" y="114" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500" fill="#263449" text-anchor="middle"><tspan x="1440" dy="0">Driver</tspan></text>
<g data-message="1" data-from="U" data-to="C" data-label="提交修改与 request_key">
<text x="320" y="173" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="320" dy="0">提交修改与 request_key</tspan></text>
<path d="M160 186H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="2" data-from="C" data-to="C" data-label="持久化有序修改，生成新指令版本">
<text x="541" y="228" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="541" dy="0">持久化有序修改，生成新指令版</tspan><tspan x="541" dy="22">本</tspan></text>
<path d="M480 263h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="3" data-from="C" data-to="U" data-label="确认已接收，尚不等于已应用">
<text x="320" y="323" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="320" dy="0">确认已接收，尚不等于已应用</tspan></text>
<path d="M480 336H160" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="4" data-from="C" data-to="H" data-label="通知控制变更">
<text x="640" y="378" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">通知控制变更</tspan></text>
<path d="M480 391H800" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="5" data-from="H" data-to="H" data-label="撤销旧调用资格，开始新规划">
<text x="861" y="470" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">撤销旧调用资格，开始新规划</tspan></text>
<path d="M800 483h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="6" data-from="M" data-to="H" data-label="迟到旧响应仅保留诊断">
<text x="960" y="543" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="960" dy="0">迟到旧响应仅保留诊断</tspan></text>
<path d="M1120 556H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="7" data-from="D" data-to="H" data-label="返回真实结果，先保存事实">
<text x="1120" y="636" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="1120" dy="0">返回真实结果，先保存事实</tspan></text>
<path d="M1440 649H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="8" data-from="H" data-to="H" data-label="完成本次记录，再处理修改">
<text x="861" y="691" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="start"><tspan x="861" dy="0">完成本次记录，再处理修改</tspan></text>
<path d="M800 704h43v23h-43" fill="none" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="9" data-from="H" data-to="M" data-label="Planner 读取新要求与有效进度">
<text x="960" y="793" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="960" dy="0">Planner 读取新要求与有效进度</tspan></text>
<path d="M800 806H1120" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
<g data-message="10" data-from="M" data-to="H" data-label="保留阶段或修订计划">
<text x="960" y="848" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#287568" text-anchor="middle"><tspan x="960" dy="0">保留阶段或修订计划</tspan></text>
<path d="M1120 861H800" stroke="#287568" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#response)"/>
</g>
<g data-message="11" data-from="H" data-to="C" data-label="记录已应用版本与新计划">
<text x="640" y="903" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263449" text-anchor="middle"><tspan x="640" dy="0">记录已应用版本与新计划</tspan></text>
<path d="M800 916H480" stroke="#263449" stroke-width="1.5" marker-end="url(#request)"/>
</g>
</svg>
