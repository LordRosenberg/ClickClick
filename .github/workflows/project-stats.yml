name: Update installer download trend

on:
  schedule:
    - cron: "23 * * * *"
  release:
    types: [published]
  workflow_run:
    workflows: [Build desktop installers]
    types: [completed]
  push:
    branches: [main]
    paths:
      - scripts/project_stats.py
      - .github/workflows/project-stats.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-download-stats
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'LordRosenberg/ClickClick' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'desktop-v')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          ref: codex/androidworld-gallery
          path: site
      - name: Sample published installer assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/project_stats.py --output site/stats
      - name: Commit refreshed download trend to website branch
        working-directory: site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats/installer-downloads.json stats/installer-downloads.svg
          if ! git diff --cached --quiet; then
            git commit -m "stats: sample installer downloads"
            git pull --rebase origin codex/androidworld-gallery
            git push origin HEAD:codex/androidworld-gallery
          fi
