<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc"><title id="title">MobileWorld evaluation: structured memory and observation flow</title><desc id="desc">Frozen October 2026 evaluation architecture. Structured summaries with source references, retained versioned notes and newest two steps assemble bounded model context. Native detail tiles are read-only. Official scoring follows execution.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94c86b"/></marker></defs><rect width="1600" height="1110" fill="#101b29"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" font-size="32" fill="#edf5fa" font-weight="bold">MobileWorld · Evaluation architecture / 评测架构</text><text x="50" y="93" font-size="20" fill="#bdcede" font-weight="normal">GPT-5.6-SOL high · 117 GUI tasks · 50 rounds · structured memory + fresh observations</text><rect x="50" y="130" width="470" height="185" rx="16" fill="#1a2b3b" stroke="#375367"/><text x="74" y="167" font-size="23" fill="#edf5fa" font-weight="bold">Task &amp; planning / 任务与规划</text><text x="74" y="203" font-size="19" fill="#bdcede" font-weight="normal">Original instruction remains authoritative</text><text x="74" y="232" font-size="19" fill="#bdcede" font-weight="normal">Planner: current stage + tentative roadmap</text><text x="74" y="261" font-size="19" fill="#bdcede" font-weight="normal">Executor: GUI work · Reviewer: on demand</text><text x="74" y="290" font-size="19" fill="#bdcede" font-weight="normal">原始任务、当前阶段与未来假设分别维护</text><rect x="555" y="130" width="490" height="185" rx="16" fill="#1a2b3b" stroke="#375367"/><text x="579" y="167" font-size="23" fill="#edf5fa" font-weight="bold">Bounded context / 有界上下文</text><text x="579" y="203" font-size="19" fill="#bdcede" font-weight="normal">Original task + stage + remaining budget</text><text x="579" y="232" font-size="19" fill="#bdcede" font-weight="normal">Current observation + summary + notes</text><text x="579" y="261" font-size="19" fill="#bdcede" font-weight="normal">Newest two complete steps + applicable skills</text><text x="579" y="290" font-size="19" fill="#bdcede" font-weight="normal">16K history · recent two-step policy retained</text><rect x="1080" y="130" width="470" height="185" rx="16" fill="#1a2b3b" stroke="#375367"/><text x="1104" y="167" font-size="23" fill="#edf5fa" font-weight="bold">Fresh observation / 新鲜观测</text><text x="1104" y="203" font-size="19" fill="#bdcede" font-weight="normal">Global pixels + UI tree + identity + geometry</text><text x="1104" y="232" font-size="19" fill="#bdcede" font-weight="normal">detail: native crop / four overlapping tiles</text><text x="1104" y="261" font-size="19" fill="#bdcede" font-weight="normal">Reading tiles do not define action coordinates</text><text x="1104" y="290" font-size="19" fill="#bdcede" font-weight="normal">原生阅读分片；动作仍绑定全局新鲜观测</text><path d="M520,221 L550,221" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080,221 L1050,221" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="372" font-size="25" fill="#caff79" font-weight="bold">MAIN UPGRADE / 主要升级：STRUCTURED MEMORY</text><rect x="50" y="406" width="470" height="240" rx="16" fill="#203d36" stroke="#94c86b"/><text x="74" y="443" font-size="23" fill="#caff79" font-weight="bold">Durable records / 持久原始记录</text><text x="74" y="479" font-size="19" fill="#bdcede" font-weight="normal">Dialogue · observations · receipts · measures</text><text x="74" y="508" font-size="19" fill="#bdcede" font-weight="normal">Versioned notes and source references</text><text x="74" y="537" font-size="19" fill="#bdcede" font-weight="normal">Recent two full steps remain uncompressed</text><text x="74" y="566" font-size="19" fill="#bdcede" font-weight="normal">Earlier records stay retrievable after compaction</text><text x="74" y="595" font-size="19" fill="#bdcede" font-weight="normal">原始记录与笔记版本持久保存，压缩不删除</text><rect x="555" y="406" width="490" height="240" rx="16" fill="#203d36" stroke="#94c86b"/><text x="579" y="443" font-size="23" fill="#caff79" font-weight="bold">Structured summary / 结构化摘要</text><text x="579" y="479" font-size="19" fill="#bdcede" font-weight="normal">results · decisions_and_attempts</text><text x="579" y="508" font-size="19" fill="#bdcede" font-weight="normal">critical_context · per-item source references</text><text x="579" y="537" font-size="19" fill="#bdcede" font-weight="normal">Target 3K / hard limit 4K characters</text><text x="579" y="566" font-size="19" fill="#bdcede" font-weight="normal">Validate schema, length and supplied references</text><text x="579" y="595" font-size="19" fill="#bdcede" font-weight="normal">结构与引用校验；不自动证明语义正确</text><rect x="1080" y="406" width="470" height="240" rx="16" fill="#203d36" stroke="#94c86b"/><text x="1104" y="443" font-size="23" fill="#caff79" font-weight="bold">Working memory / 可恢复工作记忆</text><text x="1104" y="479" font-size="19" fill="#bdcede" font-weight="normal">retained text ≤600 characters per note</text><text x="1104" y="508" font-size="19" fill="#bdcede" font-weight="normal">Bounded note packet + unresolved questions</text><text x="1104" y="537" font-size="19" fill="#bdcede" font-weight="normal">Exact version/text: reversible deduplication</text><text x="1104" y="566" font-size="19" fill="#bdcede" font-weight="normal">summary_source / read_history: recall details</text><text x="1104" y="595" font-size="19" fill="#bdcede" font-weight="normal">笔记独立恢复，缺失信息可沿来源回查</text><path d="M520,525 L550,525" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080,552 L1050,552" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><path d="M800,400 L800,321" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="700" width="470" height="206" rx="16" fill="#1a2b3b" stroke="#375367"/><text x="74" y="737" font-size="23" fill="#edf5fa" font-weight="bold">Agent work / Agent 执行</text><text x="74" y="773" font-size="19" fill="#bdcede" font-weight="normal">Model decisions → validated typed actions</text><text x="74" y="802" font-size="19" fill="#bdcede" font-weight="normal">Native indexed click + targeted text</text><text x="74" y="831" font-size="19" fill="#bdcede" font-weight="normal">double_tap + hold-before-move drag</text><text x="74" y="860" font-size="19" fill="#bdcede" font-weight="normal">Runtime stores receipts and new observations</text><rect x="555" y="700" width="490" height="206" rx="16" fill="#1a2b3b" stroke="#375367"/><text x="579" y="737" font-size="23" fill="#edf5fa" font-weight="bold">Evaluation adapter / 评测适配器</text><text x="579" y="773" font-size="19" fill="#bdcede" font-weight="normal">Dedicated-device identity + readiness gates</text><text x="579" y="802" font-size="19" fill="#bdcede" font-weight="normal">Official init → continuous agent → official eval</text><text x="579" y="831" font-size="19" fill="#bdcede" font-weight="normal">50 predictions incl. rejected acts / final answer</text><text x="579" y="860" font-size="19" fill="#bdcede" font-weight="normal">2,400s local guard; model/action counts separate</text><rect x="1080" y="700" width="470" height="206" rx="16" fill="#1a2b3b" stroke="#375367"/><text x="1104" y="737" font-size="23" fill="#edf5fa" font-weight="bold">Paired results / 配对成绩</text><text x="1104" y="773" font-size="19" fill="#bdcede" font-weight="normal">Original: 106/117 = 90.60%</text><text x="1104" y="802" font-size="19" fill="#bdcede" font-weight="normal">Substitute all nine disclosed variant results</text><text x="1104" y="831" font-size="19" fill="#bdcede" font-weight="normal">Clarified: 112/117 = 95.73%</text><text x="1104" y="860" font-size="19" fill="#bdcede" font-weight="normal">保留失败；评分器独立，不提供答案</text><path d="M650,315 L650,329 L30,329 L30,677 L285,677 L285,695" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><path d="M550,803 L525,803" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1045,803 L1075,803" fill="none" stroke="#94c86b" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="977" font-size="21" fill="#bdcede" font-weight="normal">Already present in AndroidWorld / 已有基础：role architecture · durable TaskStore · 16K history · newest two steps</text><text x="50" y="1016" font-size="21" fill="#caff79" font-weight="normal">New focus / 本次重点：structured summary · item provenance · retained memory · native detail reading · task semantics</text><text x="50" y="1055" font-size="19" fill="#bdcede" font-weight="normal">Automatic compaction-attempt notes: OFF · Frozen profile and source provenance published with the reproduction entry</text></g></svg>