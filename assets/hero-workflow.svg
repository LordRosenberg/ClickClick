<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">ClickClick cross-app workflow</title>
  <desc id="desc">A request moves from Mattermost through Calendar to a completed Mail report, coordinated by ClickClick.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#203645"/><stop offset="1" stop-color="#142631"/></linearGradient>
    <linearGradient id="phone" x2="1" y2="1"><stop stop-color="#5b7886"/><stop offset=".5" stop-color="#253d4d"/><stop offset="1" stop-color="#668392"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#baff5d" stop-opacity=".16"/><stop offset="1" stop-color="#baff5d" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4e7481" opacity=".25"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="15" stdDeviation="20" flood-color="#020c12" flood-opacity=".5"/></filter>
  </defs>
  <rect width="900" height="700" fill="#111f2b"/>
  <rect width="900" height="700" fill="url(#grid)"/>
  <ellipse cx="450" cy="365" rx="360" ry="330" fill="url(#glow)"/>
  <g fill="none" stroke="#b8f55b" stroke-width="2">
    <path d="M250 215H300Q330 215 330 250V296" stroke-dasharray="6 7" opacity=".65"/>
    <path d="M570 320H640Q668 320 668 287V243" opacity=".65"/>
    <path d="M510 470V518Q510 540 543 540H617" opacity=".65"/>
  </g>
  <g fill="#c7fb5f"><circle cx="330" cy="279" r="5"/><circle cx="668" cy="281" r="5"/><circle cx="577" cy="540" r="5"/></g>
  <g filter="url(#shadow)">
    <rect x="311" y="77" width="276" height="553" rx="43" fill="url(#phone)"/>
    <rect x="315" y="81" width="268" height="545" rx="39" fill="#0a141e"/>
    <rect x="326" y="96" width="246" height="515" rx="29" fill="#142632"/>
    <rect x="411" y="105" width="76" height="15" rx="8" fill="#07131d"/>
    <path d="M423 598H475" stroke="#73919e" stroke-width="4" stroke-linecap="round"/>
    <text x="352" y="166" fill="#a4c0cb" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CLICKCLICK</text>
    <text x="352" y="198" fill="#f0f7f4" font-family="Arial,sans-serif" font-size="22" font-weight="bold">One goal.</text>
    <text x="352" y="227" fill="#f0f7f4" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Across apps.</text>
    <g font-family="Arial,sans-serif">
      <rect x="344" y="260" width="210" height="75" rx="13" fill="#223946" stroke="#385362"/>
      <circle cx="366" cy="285" r="9" fill="#c7fb5f"/><path d="m362 285 3 3 5-6" fill="none" stroke="#1d3525" stroke-width="2"/>
      <text x="387" y="289" fill="#f0f7f4" font-size="14" font-weight="bold">Read requests</text>
      <path d="M386 310H523" stroke="#607d89" stroke-width="4" stroke-linecap="round"/>
      <rect x="344" y="350" width="210" height="75" rx="13" fill="#223946" stroke="#385362"/>
      <circle cx="366" cy="375" r="9" fill="#c7fb5f"/><path d="m362 375 3 3 5-6" fill="none" stroke="#1d3525" stroke-width="2"/>
      <text x="387" y="379" fill="#f0f7f4" font-size="14" font-weight="bold">Resolve conflicts</text>
      <path d="M386 400H512" stroke="#607d89" stroke-width="4" stroke-linecap="round"/>
      <rect x="344" y="440" width="210" height="75" rx="13" fill="#c7fb5f"/>
      <circle cx="366" cy="465" r="9" fill="#223f26"/><path d="m362 465 3 3 5-6" fill="none" stroke="#c7fb5f" stroke-width="2"/>
      <text x="387" y="469" fill="#223f26" font-size="14" font-weight="bold">Send the report</text>
      <path d="M386 490H504" stroke="#507e30" stroke-width="4" stroke-linecap="round"/>
      <text x="449" y="562" text-anchor="middle" fill="#9fbcc9" font-size="11" letter-spacing="2">PLAN · ACT · VERIFY</text>
    </g>
    <g font-family="Arial,sans-serif">
      <rect x="47" y="137" width="237" height="161" rx="18" fill="url(#panel)" stroke="#415d6b"/>
      <rect x="67" y="157" width="35" height="35" rx="10" fill="#284b63"/>
      <path d="M77 168h15v10h-7l-4 4v-4h-4z" fill="none" stroke="#80d3ef" stroke-width="2" stroke-linejoin="round"/>
      <text x="113" y="178" fill="#f1f8f7" font-size="17" font-weight="bold">Mattermost</text>
      <rect x="68" y="211" width="8" height="8" rx="4" fill="#73cdd7"/>
      <path d="M89 215H234M68 238H247M68 258H192" stroke="#688996" stroke-width="5" stroke-linecap="round"/>
      <rect x="616" y="124" width="237" height="165" rx="18" fill="url(#panel)" stroke="#415d6b"/>
      <rect x="636" y="144" width="35" height="35" rx="10" fill="#394740"/>
      <rect x="646" y="154" width="15" height="15" rx="3" fill="none" stroke="#c7fb5f" stroke-width="2"/>
      <path d="M646 159H661M650 150V156M657 150V156" stroke="#c7fb5f" stroke-width="2"/>
      <text x="682" y="166" fill="#f1f8f7" font-size="17" font-weight="bold">Calendar</text>
      <rect x="637" y="201" width="5" height="57" rx="2" fill="#c7fb5f"/>
      <rect x="653" y="201" width="175" height="25" rx="5" fill="#344f48"/>
      <rect x="653" y="235" width="122" height="23" rx="5" fill="#2b424d"/>
      <rect x="616" y="459" width="237" height="168" rx="18" fill="url(#panel)" stroke="#415d6b"/>
      <rect x="636" y="479" width="35" height="35" rx="10" fill="#424747"/>
      <rect x="645" y="490" width="17" height="12" rx="2" fill="none" stroke="#ead6ac" stroke-width="2"/>
      <path d="m646 491 8 6 7-6" stroke="#ead6ac" stroke-width="2" fill="none"/>
      <text x="682" y="502" fill="#f1f8f7" font-size="17" font-weight="bold">Mail</text>
      <path d="M637 539H827M637 559H777" stroke="#688996" stroke-width="5" stroke-linecap="round"/>
      <rect x="637" y="581" width="99" height="25" rx="12" fill="#334b32"/>
      <path d="m648 593 4 4 7-8" stroke="#c7fb5f" stroke-width="2" fill="none"/>
      <text x="668" y="598" fill="#c7fb5f" font-size="11" font-weight="bold">COMPLETE</text>
    </g>
  </g>
</svg>
